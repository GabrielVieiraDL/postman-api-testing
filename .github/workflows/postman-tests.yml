name: Automated Postman Newman Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Collections
        run: |
          if [ -f "collections/PostAir Weather API.postman_collection.json" ]; then
            newman run "collections/PostAir Weather API.postman_collection.json" \
              -e "environments/PostAir Dev.postman_environment.json" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export newman-report.html || echo "Aviso: Ajuste os environments conforme a API estiver ativa"
          else
            echo "Nenhuma coleção específica encontrada para executar ainda."
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: newman-report.html
